# Decap CMS — edit `repo` + `branch` to match your GitHub repo (see DECAP_SETUP.md)
# For local editing without GitHub: run `npm run cms` in a second terminal (with `local_backend: true` below).

backend:
  name: github
  repo: clavinohou/portfolio
  branch: main

# Uncomment for local development (run `npm run cms` alongside `npm run dev`):
local_backend: true

media_folder: public/uploads
public_folder: /uploads

site_url: https://calvinhou.com
# If GitHub Pages uses a project URL, set e.g. https://YOUR_USERNAME.github.io/YOUR_REPO_NAME/
# And set the same in vite.config.js `base`

# Show a live preview pane beside the editor for collections that opt in.
editor:
  preview: true

# —— Collections ——————————————————————————————————————————————————————————
# Focused top-level collections keep each save limited to one kind of content:
#
#   1. Projects       — one JSON file per project
#   2. Build notes    — one JSON file per note
#   3. Experience     — one JSON file per role
#   4. Profile        — one focused profile file
#   5. Contact links  — one focused links file
#   6. Résumé         — one focused résumé file
#
# Folder collections support adding one item at a time. The three single-file
# collections open directly from the Portfolio Studio navigation.
collections:
  # ————————————————————————— PROJECTS ——————————————————————————
  - name: projects
    label: Projects
    label_singular: Project
    description: Edit the projects shown on your portfolio and Build Log.
    folder: src/content/cms/projects
    create: true
    format: json
    extension: json
    slug: '{{fields.id}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: ['sortOrder', 'title', 'date']
    view_groups:
      - label: By pinned date
        field: sortOrder
        pattern: '\d{4}'
    fields:
      - {
          label: Page address,
          name: id,
          widget: string,
          pattern: ['^[a-z0-9][a-z0-9-]*$', 'Use lowercase letters, numbers, and dashes only — e.g. my-cool-project'],
          hint: 'The last part of this project’s web address. Use lowercase letters and dashes, such as my-cool-project. Leave it unchanged after publishing so old links keep working.',
        }
      - { label: Title, name: title, widget: string }
      - {
          label: Portfolio order date,
          name: sortOrder,
          widget: datetime,
          format: 'YYYY-MM-DDTHH:mm',
          date_format: 'YYYY-MM-DD',
          time_format: 'HH:mm',
          picker_utc: false,
          required: false,
          hint: 'Projects with newer dates appear first. Press “Now” to move a project to the top.',
        }
      - {
          label: Date,
          name: date,
          widget: string,
          required: false,
          hint: 'Free-form, e.g. 2024, Spring 2025, or Jan 2024 – Mar 2025.',
        }
      - {
          label: External link,
          name: link,
          widget: string,
          required: false,
          hint: 'Optional — full URL to the project (GitHub repo, live site, etc.). Leave empty if there isn’t one.',
        }
      - {
          label: Give this project a Build Log page,
          name: showInBuildLog,
          widget: boolean,
          default: true,
          hint: 'ON (default) → project appears on the Build Log at /log and clicking the card on the portfolio opens its build log page. OFF → project only shows on the portfolio; the card becomes a link to the External URL above (or non-clickable if none). Use OFF for older projects that predate the build log.',
        }
      - label: Tags
        name: tags
        widget: list
        required: false
        summary: '{{fields.tag}}'
        hint: 'Short keywords shown as pills on the project card.'
        fields:
          - { label: Tag, name: tag, widget: string }
      - {
          label: Short summary,
          name: summary,
          widget: text,
          required: false,
          hint: 'The short blurb shown on the oscilloscope PROJECTS card. Keep it to 1–2 sentences — plain text, no markdown. Leave blank to reuse the long description below.',
        }
      - {
          label: Description (Markdown),
          name: description,
          widget: markdown,
          hint: 'Long-form description shown on the Build Log project page (/log/<id>). Supports bold, lists, links, code blocks, etc.',
        }
      - {
          label: Cover image,
          name: imageUrl,
          widget: image,
          required: false,
          choose_url: true,
          hint: 'Main thumbnail — shown first in the carousel. Upload or pick from existing uploads.',
        }
      - label: Gallery / additional photos
        name: gallery
        widget: list
        required: false
        summary: '{{fields.src}}'
        hint: 'Extra photos rotated in the image stack after the cover image.'
        fields:
          - {
              label: Image,
              name: src,
              widget: image,
              choose_url: true,
            }
      - {
          label: Visible images on portfolio card,
          name: stackSize,
          widget: number,
          value_type: int,
          min: 1,
          max: 8,
          required: false,
          hint: 'Shown on the oscilloscope PROJECTS card (calvinhou.com). That card is narrow and sits next to a short summary, so 1–3 images usually looks best. Leave blank to show all.',
        }
      - {
          label: Visible images on Build Log page,
          name: buildLogStackSize,
          widget: number,
          value_type: int,
          min: 1,
          max: 8,
          required: false,
          hint: 'Shown on the Build Log project page (/log/<id>). That hero is taller (sits next to the long description), so 3–5 images usually looks best. Leave blank to reuse the portfolio card value above, or fall back to showing all.',
        }

  # ————————————————————————— BUILD LOG —————————————————————————
  - name: blog
    label: Build notes
    label_singular: Build note
    description: Add short progress updates, discoveries, failures, and breakthroughs to a project.
    folder: src/content/cms/blog
    create: true
    format: json
    extension: json
    slug: '{{fields.id}}'
    identifier_field: title
    summary: '{{title}}  ·  {{project}}  ·  {{date}}'
    sortable_fields: ['date', 'project', 'title']
    view_groups:
      - label: By project
        field: project
      - label: By year
        field: date
        pattern: '\d{4}'
    view_filters:
      - label: This year
        field: date
        pattern: '2026'
      - label: Last year
        field: date
        pattern: '2025'
    fields:
      - {
          label: Note address,
          name: id,
          widget: string,
          pattern: ['^[a-z0-9][a-z0-9-]*$', 'Use lowercase letters, numbers, and dashes only — e.g. climber-v3-tuning'],
          hint: 'A short permanent name using lowercase letters and dashes, such as climber-v3-tuning.',
        }
      - { label: Title, name: title, widget: string, hint: 'The headline for this entry. Keep it punchy.' }
      - {
          label: Date / time,
          name: date,
          widget: datetime,
          format: 'YYYY-MM-DDTHH:mm',
          date_format: 'YYYY-MM-DD',
          time_format: 'HH:mm',
          picker_utc: false,
          hint: 'When the entry was written. Used for chronological ordering.',
        }
      - {
          label: Related project,
          name: project,
          widget: relation,
          collection: projects,
          search_fields: [title, id],
          display_fields: [title],
          value_field: id,
          required: true,
          hint: 'Pick the project this entry belongs to. The entry will appear on that project’s /log/<id> page.',
        }
      - {
          label: One-line summary,
          name: summary,
          widget: text,
          required: false,
          hint: 'Italicized blurb shown right under the title. Think: TL;DR in one sentence.',
        }
      - label: Tags
        name: tags
        widget: list
        required: false
        summary: '{{fields.tag}}'
        fields:
          - { label: Tag, name: tag, widget: string }
      - {
          label: Body (Markdown),
          name: body,
          widget: markdown,
          hint: 'The actual entry. Supports bold, lists, headings, fenced code blocks, quotes, links, etc.',
        }
      - label: Photos / diagrams
        name: gallery
        widget: list
        required: false
        summary: '{{fields.src}}'
        hint: 'Scope captures, whiteboard photos, sketches, CAD screenshots — anything that tells the story.'
        fields:
          - {
              label: Image,
              name: src,
              widget: image,
              choose_url: true,
            }
      - {
          label: Visible images on Build Log entry,
          name: stackSize,
          widget: number,
          value_type: int,
          min: 1,
          max: 8,
          required: false,
          hint: 'How many images show in the stack on this entry. Leave blank to show all.',
        }

  # ————————————————————————— EXPERIENCE —————————————————————————
  - name: experience
    label: Experience
    label_singular: Role
    description: Edit one job, internship, research role, or club position at a time.
    folder: src/content/cms/experience
    create: true
    format: json
    extension: json
    slug: '{{fields.id}}'
    identifier_field: title
    summary: '{{order}} · {{title}} — {{company}}'
    sortable_fields: ['order', 'company', 'title']
    fields:
      - {
          label: Page address,
          name: id,
          widget: string,
          pattern: ['^[a-z0-9][a-z0-9-]*$', 'Use lowercase letters, numbers, and dashes only.'],
          hint: 'A permanent internal name, such as delta-electronics. Leave it unchanged after publishing.',
        }
      - {
          label: Portfolio position,
          name: order,
          widget: number,
          value_type: int,
          min: 1,
          hint: '1 appears first, 2 appears second, and so on.',
        }
      - { label: Role type, name: type, widget: string, hint: 'For example: Internship, Club, or Externship.' }
      - { label: Role title, name: title, widget: string }
      - { label: Organization, name: company, widget: string }
      - { label: Location, name: location, widget: string }
      - { label: Dates, name: date, widget: string, hint: 'For example: Jun 2026 – Aug 2026.' }
      - { label: Description, name: description, widget: markdown }
      - label: Skills & topics
        name: tags
        widget: list
        required: false
        summary: '{{fields.tag}}'
        fields:
          - { label: Skill or topic, name: tag, widget: string }
      - label: Photos
        name: gallery
        widget: list
        required: false
        summary: '{{fields.src}}'
        hint: 'Logos, team photos, or work samples shown with this role.'
        fields:
          - { label: Image, name: src, widget: image, choose_url: true }
      - {
          label: Visible photos,
          name: stackSize,
          widget: number,
          value_type: int,
          min: 1,
          max: 8,
          required: false,
          hint: 'Leave blank to show every uploaded photo.',
        }

  # ————————————————————————— PROFILE —————————————————————————
  - name: profile
    label: Profile
    description: Edit your name, headline, school details, interests, and About text.
    files:
      - label: Edit profile
        name: profile
        file: src/content/cms/profile.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title / headline, name: title, widget: string }
          - {
              label: Homepage introduction,
              name: scopeBrief,
              widget: text,
              required: false,
              hint: 'The short line shown near your name on the oscilloscope screen.',
            }
          - { label: School, name: school, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: Year, name: year, widget: string }
          - label: Interests
            name: interests
            widget: list
            summary: '{{fields.interest}}'
            fields:
              - { label: Interest, name: interest, widget: string }
          - label: About paragraphs
            name: about
            widget: list
            summary: '{{fields.paragraph}}'
            fields:
              - { label: Paragraph, name: paragraph, widget: markdown }

  # ————————————————————————— CONTACT LINKS —————————————————————————
  - name: links
    label: Contact links
    description: Edit the email and social profiles shown across the portfolio.
    files:
      - label: Edit contact links
        name: links
        file: src/content/cms/links.json
        format: json
        fields:
          - { label: Email, name: email, widget: string }
          - { label: GitHub URL, name: github, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string }
          - { label: Instagram URL, name: instagram, widget: string, required: false }

  # ————————————————————————— RESUME —————————————————————————
  - name: resume
    label: Résumé
    description: Replace your résumé PDF and edit the highlights shown beside it.
    files:
      - label: Edit résumé
        name: resume
        file: src/content/cms/resume.json
        format: json
        fields:
          - { label: Download button label, name: downloadLabel, widget: string }
          - {
              label: Résumé PDF,
              name: downloadUrl,
              widget: file,
              choose_url: true,
              hint: 'Upload a PDF or choose an existing one.',
            }
          - {
              label: Last updated,
              name: lastUpdated,
              widget: string,
              required: false,
              hint: 'Updated automatically when the PDF changes. You can edit it if needed.',
            }
          - { label: '', name: internalPrevUrl, widget: hidden, default: '' }
          - label: Highlight bullets
            name: highlights
            widget: list
            fields:
              - { label: Highlight, name: highlight, widget: string }
